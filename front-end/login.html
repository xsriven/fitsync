<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login aluno - FitSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="bg-fundo"></div>
    <div class="bg-overlay"></div>

    <div class="hero-container">
        <div class="login-card split-card">
            
            <div class="card-column form-side">
                <h1>Entrar no <span class="neon-text">FitSync</span></h1>
                <p class="subtitle">Sua performance, em perfeita sintonia.</p>
                
                <form id="loginForm">
                    <input type="hidden" name="userType" value="ALUNO">

                    <label for="email">E-mail do aluno</label>
                    <input id="email" type="email" name="email" placeholder="Insira seu e-mail" required>

                    <label for="password">Senha</label>
                    <input id="password" type="password" name="password" placeholder="Digite sua senha" required>

                    <button id="loginButton" type="submit">Entrar</button>
                </form>
                <div id="message" class="message"></div>
            </div>

            <div class="vertical-divider"></div>

            <div class="card-column action-side">
                <h2>Área do <span class="neon-text">personal</span></h2>
                <p class="action-description">Acesse seu painel técnico para gerenciar fichas de treino, anamneses e acompanhar a evolução dos seus alunos.</p>
                
                <a href="login_personal.html" class="btn-secondary-neon">Acessar portal técnico</a>
            </div>

        </div>
    </div>

    <footer class="footer">
        <p>Não possui uma conta? Contate seu Personal Trainer para obter o acesso.</p>
    </footer>

    <script src="js/auth/api.js"></script>
    <script src="js/auth/ui.js"></script>
    <script src="js/auth/handlers.js"></script>
</body>
</body>
</html>
