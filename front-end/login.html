<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login FitSync</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="bg-fundo"></div>
    <div class="bg-overlay"></div>

    <div class="hero-container">
        <div class="login-card">
            <h1>Entrar no <span class="neon-text">FitSync</span></h1>
            <p class="subtitle">Sua performance, em perfeita sintonia.</p>
            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="seu@email.com" required>

                <label for="password">Senha</label>
                <input id="password" type="password" name="password" placeholder="Senha" required>

                <button id="loginButton" type="submit">Entrar</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Não possui cadastro? <a href="index.html" class="footer-link">Voltar ao início</a></p>
    </footer>

    <script src="../js/login.js"></script>
</body>
</html>
