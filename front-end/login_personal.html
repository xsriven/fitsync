<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Técnico Personal - FitSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="bg-fundo"></div>
    <div class="bg-overlay"></div>

    <div class="hero-container">
        <div class="login-card split-card">
            
            <div class="card-column form-side">
                <h1>Portal <span class="neon-text">Técnico</span></h1>
                <p class="subtitle">Gerenciamento inteligente de treinos e alta performance.</p>
                
                <form id="loginForm">
                    <input type="hidden" name="userType" value="PERSONAL">

                    <label for="email">E-mail Profissional</label>
                    <input id="email" type="email" name="email" placeholder="Insira seu e-mail" required>

                    <label for="password">Senha</label>
                    <input id="password" type="password" name="password" placeholder="Digite sua senha" required>

                    <button id="loginButton" type="submit">Acessar Painel</button>
                </form>
                <div id="message" class="message"></div>
            </div>

            <div class="vertical-divider"></div>

            <div class="card-column action-side">
                <h2>Área do <span class="neon-text">Aluno</span></h2>
                <p class="action-description">Quer consultar sua ficha de treino ativa, registrar suas execuções diárias ou acompanhar a evolução do seu IMC?</p>
                
                <a href="login.html" class="btn-secondary-neon">Acessar Como Aluno</a>
            </div>

        </div>
    </div>

    <footer class="footer">
        <p>Acesso restrito a profissionais cadastrados. FitSync &copy; 2026.</p>
    </footer>

    <script src="js/auth/api.js"></script>
    <script src="js/auth/ui.js"></script>
    <script src="js/auth/handlers.js"></script>
</body>
</html>
